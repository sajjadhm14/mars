name: yadavari

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${LARAVEL_DB_PASSWORD:-local-development-only}
    volumes:
      - laravel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  mars:
    build:
      context: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: todo
      DB_USERNAME: todo
      DB_PASSWORD: ${LARAVEL_DB_PASSWORD:-local-development-only}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${LARAVEL_API_PORT:-8001}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:3000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    init: true

  jupiter:
    build:
      context: ../jupiter
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${LARAVEL_WEB_PORT:-3000}:80"
    depends_on:
      mars:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${LARAVEL_MAILPIT_PORT:-8025}:8025"

volumes:
  laravel_postgres_data:
